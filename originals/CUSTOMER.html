const dateAfter=d=>dateText(new Date(Date.now()+d*86400000));
const state={logged:false,auth:'welcome',screen:'home',balance:0,name:'',email:'',accountId:'',numbers:[],operations:[],notifications:[],theme:'light',notifEnabled:true,homeStep:'entry',queryNumber:'',selectedDays:0,package:0,payment:'',reference:'',search:'',filter:'الكل',modalMode:'',modalNumber:'',modalStep:'entry',modalSelectedDays:0,modalFromRadar:false,modalOrigin:'',authEmail:'',authName:'',authId:'',currentCustomerId:''};
function tariffFor(number,days){let cname=company(number),c=readRegistry().companies.find(x=>x.name===cname);return Number(c?.plans?.find(p=>Number(p.days)===Number(days))?.costPoints)||0}const tariffs=new Proxy({}, {get:(_,days)=>tariffFor(state.queryNumber||state.modalNumber,days)});function planOptions(number,selected){let c=readRegistry().companies.find(x=>x.name===company(number));return (c?.plans||[]).map(p=>({value:Number(p.days),label:`${fmt(p.days)} يوم — ${fmt(p.costPoints)} نقطة`}));}
const packages=new Proxy([], {get:(_,prop)=>{const arr=readRegistry().packages;if(prop==='length')return arr.length;if(prop===Symbol.iterator)return arr[Symbol.iterator].bind(arr);if(/^\d+$/.test(String(prop)))return arr[Number(prop)];return Array.prototype[prop]?.bind(arr)}});
function currentCustomer(){const db=readRegistry();return db.customers.find(c=>c.id===state.currentCustomerId)||db.customers.find(c=>c.email===state.email)||null}
function saveCustomerState(){if(!state.logged||!state.currentCustomerId)return;const db=readRegistry(),c=db.customers.find(x=>x.id===state.currentCustomerId);if(!c)return;c.name=state.name;c.email=state.email;c.balance=Number(state.balance)||0;c.numbers=state.numbers;c.operations=state.operations;c.notifications=state.notifications;c.updatedAt=new Date().toISOString();db.numbers=db.numbers.filter(n=>n.customerId!==c.id).concat(state.numbers.map(n=>({...n,customerId:c.id,customerName:c.name,customerEmail:c.email})));db.subscriptions=db.subscriptions.filter(n=>n.customerId!==c.id).concat(state.numbers.filter(n=>n.added&&n.expiry&&new Date(n.expiry)>new Date()).map(n=>({...n,customerId:c.id,customerName:c.name,customerEmail:c.email})));db.operations=db.operations.filter(o=>o.customerId!==c.id).concat(state.operations.map(o=>({...o,customerId:c.id})));writeRegistry(db)}
function loadCustomerState(c){state.currentCustomerId=c.id;state.name=c.name||'';state.email=c.email||'';state.accountId=c.accountId||c.id;state.balance=Number(c.balance)||0;state.numbers=Array.isArray(c.numbers)?c.numbers:[];state.operations=Array.isArray(c.operations)?c.operations:[];state.notifications=Array.isArray(c.notifications)?c.notifications:[];state.logged=true}
function dynamicPaymentOptions(){return readRegistry().paymentMethods.map((p,i)=>({value:p.id||p.name,label:p.name}))}

function icon(){if(window.lucide)lucide.createIcons()}
function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.add('hidden'),3200)}
function notify(title,body){if(!state.notifEnabled)return;state.notifications.unshift({id:Date.now()+Math.random(),title,body,time:now(),read:false});$('unread-dot').classList.remove('hidden')}
function eventRecord(type,description,points,status='مكتملة',extra={}){state.operations.unshift({id:Date.now()+Math.random(),type,description,points,status,time:now(),pointsBefore:extra.pointsBefore??state.balance,pointsAdded:extra.pointsAdded??0,pointsAfter:extra.pointsAfter??state.balance,daysBefore:extra.daysBefore??null,daysAdded:extra.daysAdded??0,daysAfter:extra.daysAfter??null,purchasePoints:extra.purchasePoints??0,purchasePrice:extra.purchasePrice??0});notify(type,description)}
function findNumber(n){return state.numbers.find(x=>x.number===normalize(n))}
function ensureNumber(n){let item=findNumber(n);if(!item){item={number:normalize(n),company:company(n),days:0,expiry:'',radar:false,added:false};state.numbers.push(item)}return item}
function activeDays(item){if(!item)return 0;let end=item.expiry?new Date(item.expiry).getTime():0;return Math.max(0,Math.ceil((end-Date.now())/86400000))}
function protection(item){return activeDays(item)>0?'مشمول بالخدمة':'غير مشمول بالخدمة'}
function nav(screen){state.screen=screen;state.search='';state.filter='الكل';closeModal();render()}
function render(){document.body.classList.toggle('dark',state.theme==='dark'||(state.theme==='device'&&matchMedia('(prefers-color-scheme: dark)').matches));$('top').classList.toggle('hidden',!state.logged);$('bottom').classList.toggle('hidden',!state.logged);$('content').classList.toggle('auth',!state.logged);$('content').classList.toggle('home-content',state.logged&&state.screen==='home');$('balance-btn').textContent=fmt(state.balance)+' نقطة';document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.go===state.screen));$('content').innerHTML=state.logged?screenHtml():authHtml();icon()}
const btn=(text,act,cls='primary')=>`<button type="button" class="${cls}" data-action="${act}">${text}</button>`;
const heading=t=>`<div class="screen-heading"><button type="button" class="screen-back" data-action="screen-back" aria-label="خروج من الشاشة"><i data-lucide="arrow-right"></i></button><h1 class="screen-title">${t}</h1></div>`;
const field=(id,label,value='',type='text',autocomplete='off')=>`<label class="label" for="${id}">${label}</label><input id="${id}" class="field" type="${type}" value="${esc(value)}" placeholder="" autocomplete="${autocomplete}">`;
function selectWidget(id,label,options,selectedValue){let chosen=options.find(o=>String(o.value)===String(selectedValue));return `<label class="label">${label}</label><div class="select-widget"><button type="button" id="${id}-trigger" class="field select-trigger" data-action="custom-select-toggle" data-select-id="${id}"><span>${esc(chosen?chosen.label:'اختر '+label)}</span><i data-lucide="chevron-down"></i></button><div id="${id}-options" class="select-options hidden">${options.map(o=>`<button type="button" class="select-option" aria-selected="${String(o.value)===String(selectedValue)}" data-action="custom-select-option" data-select-id="${id}" data-value="${esc(String(o.value))}">${esc(o.label)}</button>`).join('')}</div></div>`; }
const summary=rows=>`<div class="summary">${rows.map(([a,b])=>`<div class="row"><span class="muted">${a}</span><span>${esc(b)}</span></div>`).join('')}</div>`;
function authHtml(){let a=state.auth,core='';if(a==='welcome')core=`<div class="auth-brand"><h1 class="auth-logo">أمان</h1><p class="auth-sub">أمان حماية وضمان</p></div><section class="card center-card"><div class="stack">${btn('تسجيل الدخول','auth-login','primary wide')}${btn('إنشاء حساب','auth-register','secondary wide')}</div></section>`;
if(a==='login')core=`<div class="auth-brand"><h1 class="auth-logo">أمان</h1></div><section class="card center-card"><h2 style="text-align:center">تسجيل الدخول</h2>${field('auth-email','البريد الإلكتروني',state.authEmail,'email','email')}${field('auth-password','كلمة المرور','','password','current-password')}<div class="actions">${btn('دخول','auth-enter','primary wide')}</div><div class="row">${btn('نسيت بيانات الدخول؟','auth-recover','link')}${btn('إنشاء حساب','auth-register','link')}</div></section>`;
if(a==='register')core=`<div class="auth-brand"><h1 class="auth-logo">أمان</h1></div><section class="card center-card"><h2 style="text-align:center">إنشاء حساب</h2>${field('auth-name','الاسم الكامل',state.authName)}${field('auth-email','البريد الإلكتروني',state.authEmail,'email','email')}${field('auth-password','كلمة المرور','','password','new-password')}${field('auth-confirm','تأكيد كلمة المرور','','password','new-password')}<label class="row small" style="justify-content:flex-start;margin-top:17px"><input id="agree" type="checkbox"><span>أوافق على <button type="button" class="link" style="display:inline;padding:0" data-action="terms">الشروط والأحكام</button></span></label><div class="actions">${btn('إنشاء حساب','auth-create','primary wide')}</div>${btn('لدي حساب بالفعل','auth-login','link')}</section>`;
if(a==='recover')core=`<div class="auth-brand"><h1 class="auth-logo">أمان</h1></div><section class="card center-card"><h2 style="text-align:center">استعادة الحساب</h2>${field('auth-email','البريد الإلكتروني',state.authEmail,'email','email')}${field('auth-id','معرف الحساب ID',state.authId)}<div class="actions">${btn('متابعة الاستعادة','auth-send','primary wide')}</div>${btn('العودة لتسجيل الدخول','auth-login','link')}</section>`;return `<div class="auth-wrap">${core}</div>`}
function screenHtml(){switch(state.screen){case'home':return homeHtml();case'buy':return buyHtml();case'numbers':return numbersHtml();case'radar':return radarHtml();case'operations':return operationsHtml();case'account':return accountHtml();case'settings':return settingsHtml();case'security':return securityHtml();case'notifications':return notificationsHtml();default:return homeHtml()}}
function dropdownNumbers(){let list=state.numbers.filter(x=>x.added).sort((a,b)=>normalize(a.number).localeCompare(normalize(b.number)));return `<div class="home-dropdown hidden" id="number-dropdown"><div class="drop-head home-drop-head"><span>الشركة</span><span>الرقم</span><span>الحالة</span></div>${list.map(x=>{let included=activeDays(x)>0;return `<button class="drop-row home-drop-row" data-action="select-number" data-number="${x.number}"><span>${esc(x.company)}</span><span dir="ltr">${x.number}</span><span class="home-drop-status">${included?'<i data-lucide="shield-check" aria-label="اشتراكه سارٍ"></i>':''}${included&&x.radar?'<i data-lucide="radar" aria-label="في الرادار"></i>':''}</span></button>`}).join('')}</div>`}
function homeHtml(){let step=state.homeStep,n=state.queryNumber,item=findNumber(n),days=activeDays(item),cost=tariffs[state.selectedDays]||0;let content='';
if(step==='entry')content=`<h2>أدخل رقم الهاتف</h2><div class="dropdown-anchor"><div class="input-wrap"><input id="query-phone" class="field" type="tel" inputmode="numeric" aria-label="رقم الهاتف" placeholder="" value="${esc(n)}"><button class="iconbtn" data-action="toggle-dropdown" aria-label="اختيار رقم"><i data-lucide="chevron-down"></i></button></div>${dropdownNumbers()}</div><div id="detected-company" class="company-box">${company(n)||'شركة الاتصالات'}</div><div class="actions">${btn('البحث','query','primary wide')}</div>`;
if(step==='loading')content=`<h2>البحث عن الرقم</h2><p class="small muted" style="text-align:center">جارٍ البحث…</p>`;
if(step==='result'){let included=days>0;content=`<div class="emoji-wrap"><div class="emoji-halo"><span class="status-icon" role="img" aria-label="${included?'الرقم لديه اشتراك سارٍ':'الرقم لا يملك اشتراكًا ساريًا'}"><i data-lucide="${included?'shield-check':'shield-alert'}"></i></span></div></div>${summary([['رقم الهاتف',display(n)],['شركة الاتصالات',company(n)],['حالة الاشتراك',protection(item)],...(included?[['مدة الاشتراك',fmt(days)+' يوم'],['الانتهاء',dateText(item.expiry)]]:[])])}<h3 style="margin-top:17px">${included?'تمديد الاشتراك':'تفعيل الاشتراك'}</h3>${selectWidget('protection-days','مدة الاشتراك',planOptions(n,state.selectedDays),state.selectedDays||'')}<div class="notice">تكلفة الاشتراك <strong id="protection-cost">${state.selectedDays?fmt(cost)+' نقطة':'—'}</strong></div><div class="stack" style="margin-top:15px">${btn(included?'تمديد الاشتراك':'تفعيل الاشتراك','protect-review','primary wide')}${btn('البحث عن رقم آخر','query-reset','secondary wide')}</div>`}
if(step==='review')content=`<h2>تأكيد العملية</h2>${summary([['رقم الهاتف',display(n)],['شركة الاتصالات',company(n)],['الأيام المضافة',fmt(state.selectedDays)+' يوم'],['تكلفة الاشتراك من رصيد أمان',fmt(tariffs[state.selectedDays])+' نقطة']])}<div class="stack" style="margin-top:18px">${btn('تأكيد','protect-confirm','primary wide')}${btn('تعديل','protect-edit','secondary wide')}</div>`;
if(step==='success'){let x=findNumber(n);let radarAction=x&&!x.radar?btn('إضافة إلى الرادار','success-radar','secondary wide'):'';content=`<h2 style="text-align:center;color:var(--ink)">عملية ناجحة</h2>${summary([['رقم الهاتف',display(n)],['شركة الاتصالات',company(n)],['المدة المتبقية للاشتراك',fmt(activeDays(x))+' يوم'],['ينتهي الاشتراك في',dateText(x.expiry)],['رصيد أمان الحالي',fmt(state.balance)+' نقطة']])}<div class="stack" style="margin-top:17px">${btn('البحث عن رقم آخر','query-reset','primary wide')}${radarAction}</div>`}
return `<section class="card center-card home-card">${content}</section>`}
function listToolbar(){let opts=state.screen==='operations'?[['الكل','كل العمليات'],['شحن','شحن رصيد أمان'],['خصم','استخدام رصيد أمان']]:[['الكل','كل الشركات'],...providers.map(p=>[p.name,p.name])];let selected=opts.find(([v])=>v===state.filter)||opts[0];return `<div class="list-toolbar"><input id="list-search" class="field" type="search" placeholder="بحث" aria-label="بحث" value="${esc(state.search)}"><div class="select-widget filter-select"><button type="button" id="company-filter-trigger" class="field select-trigger" data-action="custom-select-toggle" data-select-id="company-filter" aria-label="الفلترة"><span>${esc(selected[1])}</span><i data-lucide="chevron-down"></i></button><div id="company-filter-options" class="select-options hidden">${opts.map(([v,label])=>`<button type="button" class="select-option" aria-selected="${state.filter===v}" data-action="custom-select-option" data-select-id="company-filter" data-value="${esc(v)}">${esc(label)}</button>`).join('')}</div></div></div>`}
function listCard(x,kind){let days=activeDays(x),included=days>0;return `<button class="item compact-item number-list-card" data-action="${kind}-detail" data-number="${x.number}"><div class="number-card-top"><strong dir="ltr">${x.number}</strong><span class="number-status-icons">${included?'<i data-lucide="shield-check" aria-label="اشتراكه سارٍ"></i>':''}${included&&x.radar?'<i data-lucide="radar" aria-label="في الرادار"></i>':''}</span></div><div class="number-card-meta"><span class="number-company">${esc(x.company)}</span><span class="remaining-days">${fmt(days)} ${days===1?'يوم':'يوم'}</span></div></button>`}
function radarHtml(){let tracked=state.numbers.filter(x=>x.radar&&activeDays(x)>0).sort((a,b)=>normalize(a.number).localeCompare(normalize(b.number))).filter(x=>(state.filter==='الكل'||x.company===state.filter)&&(`${x.number} ${x.company}`.includes(normalize(state.search))||x.company.includes(state.search)));return `<div class="list-screen">${heading('الرادار')}${listToolbar()}<section class="list-scroll">${tracked.length?tracked.map(x=>listCard(x,'radar')).join(''):'<div class="card small muted" style="text-align:center;margin-top:12px">لا توجد أرقام ذات اشتراك سارٍ في الرادار.</div>'}</section><button class="floating-add" data-action="radar-add-open" aria-label="إضافة رقم إلى الرادار">+</button></div>`}
function numbersHtml(){let list=state.numbers.filter(x=>x.added).sort((a,b)=>normalize(a.number).localeCompare(normalize(b.number))).filter(x=>(state.filter==='الكل'||x.company===state.filter)&&(`${x.number} ${x.company}`.includes(normalize(state.search))||x.company.includes(state.search)));return `<div class="list-screen">${heading('الأرقام')}${listToolbar()}<section class="list-scroll">${list.length?list.map(x=>listCard(x,'number')).join(''):'<div class="card small muted" style="text-align:center;margin-top:12px">لا توجد أرقام مضافة.</div>'}</section><button class="floating-add" data-action="number-add-open" aria-label="إضافة رقم">+</button></div>`}
function operationsHtml(){let list=state.operations.slice().sort((a,b)=>b.id-a.id).filter(x=>(state.filter==='الكل'||(state.filter==='خصم'&&x.points<0)||(state.filter==='شحن'&&x.type.includes('شحن')))&&(`${x.type} ${x.description}`.includes(state.search)));return `<div class="list-screen">${heading('العمليات')}${listToolbar()}<section class="list-scroll">${list.length?list.map(x=>`<button class="item compact-item" data-action="operation-detail" data-id="${x.id}"><div class="row"><strong>${esc(x.type)}</strong><strong>${x.points?`${x.points>0?'+':'−'}${fmt(Math.abs(x.points))} نقطة`:'—'}</strong></div><p>${esc(x.description)}</p><p>${esc(x.time)} · ${esc(x.status)}</p></button>`).join(''):'<div class="card small muted" style="text-align:center;margin-top:12px">لا توجد عمليات حتى الآن.</div>'}</section></div>`}
function buyHtml(){let db=readRegistry(),ps=db.packages||[],methods=db.paymentMethods||[],p=ps[state.package]||null,bank=methods.find(x=>(x.id||x.name)===state.payment);if(!p||!methods.length)return heading('شحن رصيد أمان')+`<section class="card center-card"><p class="small muted" style="text-align:center">${!ps.length?'لا توجد باقات شحن متاحة حاليًا.':'لا توجد وسائل دفع متاحة حاليًا.'}</p></section>`;return heading('شحن رصيد أمان')+`<section class="card center-card">${selectWidget('package','باقة الشحن',ps.map((x,i)=>({value:i,label:`${x.name} — ${fmt(x.points)} نقطة`})),state.package)}<div class="notice" id="package-info">${fmt(p.points)} نقطة · ${fmt(p.price)} ر.ي</div>${selectWidget('payment','وسيلة الدفع',methods.map(x=>({value:x.id||x.name,label:x.name})),state.payment||methods[0].id||methods[0].name)}<div class="card" id="payment-instructions" style="margin-top:10px;padding:13px;background:var(--chip);box-shadow:none"><h3 id="payment-instructions-title">بيانات الحساب وتعليمات الدفع</h3><p id="payment-instructions-body" class="small">${esc(bank?.instructions||'أكمل الدفع وفق بيانات وسيلة الدفع المحددة ثم أدخل مرجع العملية.')}</p></div>${field('reference','مرجع الدفع',state.reference)}<div class="stack" style="margin-top:16px">${btn('إرسال طلب شحن رصيد أمان','buy-confirm','primary wide')}</div><p class="small muted">يظل طلب الشحن قيد المراجعة حتى اعتماده، ولا يُضاف رصيد أمان قبل ذلك.</p></section>`}
function accountHtml(){return heading('الحساب')+`<section class="card center-card account-profile"><div class="badge"><i data-lucide="user-round"></i></div><h2 style="text-align:center">${esc(state.name)}</h2><p class="small muted" style="text-align:center">${esc(state.email)}</p><div class="divider"></div><div class="summary"><div class="row"><span class="muted">البريد الإلكتروني</span><span>${esc(state.email)}</span></div><div class="row"><span class="muted">معرف الحساب</span><span class="account-id-value"><b dir="ltr">${esc(state.accountId)}</b><button class="copy-id" data-action="copy-account-id" aria-label="نسخ معرف الحساب"><i data-lucide="copy"></i></button></span></div></div></section><section class="account-links center-card"><button type="button" class="account-link" data-action="settings"><span class="account-link-label"><i data-lucide="settings-2"></i><span>الإعدادات</span></span><i class="account-link-arrow" data-lucide="chevron-right"></i></button><button type="button" class="account-link" data-action="security"><span class="account-link-label"><i data-lucide="shield-check"></i><span>تأمين التطبيق</span></span><i class="account-link-arrow" data-lucide="chevron-right"></i></button><button type="button" class="account-link" data-action="account-help"><span class="account-link-label"><i data-lucide="circle-help"></i><span>المساعدة</span></span><i class="account-link-arrow" data-lucide="chevron-right"></i></button></section><div class="account-exit-row center-card"><button type="button" class="account-logout" data-action="logout"><i data-lucide="log-out"></i><span>تسجيل الخروج</span></button></div>`}
function settingsHtml(){return heading('الإعدادات')+`<section class="card center-card"><h2>المظهر</h2><label class="label" for="theme">نمط العرض</label><select id="theme"><option value="light" ${state.theme==='light'?'selected':''}>فاتح</option><option value="dark" ${state.theme==='dark'?'selected':''}>داكن</option><option value="device" ${state.theme==='device'?'selected':''}>حسب إعداد الجهاز</option></select><div class="divider"></div><label class="row small"><span>تفعيل إشعارات التطبيق</span><input id="notifications-enabled" type="checkbox" ${state.notifEnabled?'checked':''}></label></section>`}
function securityHtml(){return heading('تأمين التطبيق')+`<section class="card center-card"><p class="small muted">إدارة أمان الجلسة داخل هذه المعاينة.</p>${btn('إنهاء الجلسة','logout','secondary wide')}</section>`}
function notificationsHtml(){return heading('الإشعارات')+`<section>${state.notifications.length?state.notifications.map(n=>`<button class="item" data-action="notification-detail" data-id="${n.id}"><strong>${esc(n.title)}</strong><p>${esc(n.body)}</p><p>${esc(n.time)}</p></button>`).join(''):'<div class="card center-card small muted" style="text-align:center">لا توجد إشعارات حاليًا</div>'}</section>`}
function modal(title,body,buttons=''){closeModal();$('modal-layer').innerHTML=`<div class="modal-back" id="modal-back"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="row"><h2>${esc(title)}</h2><button class="close" data-action="close-modal" aria-label="إغلاق">×</button></div><div>${body}</div>${buttons?`<div class="stack" style="margin-top:15px">${buttons}</div>`:''}</div></div>`;icon()}
