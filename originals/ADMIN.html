<head>
<meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Alexandria:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f8f7;--surface:#fff;--field-bg:#f0f2f0;--ink:#161817;--muted:#727a78;--line:#e9ecea;--field-line:#d5dad6;--button:#141615;--button-ink:#fff;--positive:#00695C;--chip:#eef5f3;--shadow:0 3px 13px #1b292015;--aman-accent:#00695C;--aman-accent-soft:#B2DFDB}
*{box-sizing:border-box}html,body{margin:0;min-width:280px;height:100%;}body{font-family:Alexandria,'DM Sans',sans-serif;background:#e8ebe8;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--aman-accent);outline-offset:2px}
.phone{width:100%;max-width:430px;margin:auto;height:100dvh;min-height:0;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 12px 45px #0002}
.topbar,.bottom{position:absolute;z-index:10;background:var(--bg);right:0;left:0}.topbar{top:0;height:69px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid var(--line)}
.iconbtn{display:grid;place-items:center;width:39px;height:39px;border:0;border-radius:50%;background:var(--chip);color:var(--ink);position:relative;flex:none}.iconbtn svg{width:19px;height:19px}.dot{position:absolute;width:7px;height:7px;background:var(--aman-accent);border-radius:50%;top:4px;left:4px}.balance{margin-right:auto;border:0;border-radius:40px;background:var(--button);color:var(--button-ink);padding:10px 13px;font-size:12px;font-weight:700;white-space:nowrap}
.bottom{bottom:0;min-height:77px;padding:7px 5px max(8px,env(safe-area-inset-bottom));border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px}.navbtn{min-width:0;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;padding:5px 1px;font-size:10px;line-height:1.25;white-space:nowrap;overflow:hidden}.navbtn.active{color:var(--ink);font-weight:700;position:relative}.navbtn.active:after{content:"";position:absolute;bottom:1px;left:calc(50% - 10px);width:20px;height:3px;border-radius:3px;background:var(--aman-accent)}.navbtn svg{width:19px;height:19px;flex:none}
.content{position:absolute;top:69px;bottom:77px;right:0;left:0;overflow:auto;padding:8px 19px 28px;scrollbar-width:thin}.screen-heading{display:flex;align-items:center;justify-content:flex-start;gap:9px;margin:0 0 16px}.screen-title{text-align:right;font-size:17px;font-weight:700;margin:0;line-height:1.5}.screen-back{display:grid;place-items:center;width:32px;height:32px;border:0;border-radius:50%;background:var(--chip);color:var(--ink);flex:none}.screen-back svg{width:17px;height:17px}
.toolbar{display:grid;grid-template-columns:minmax(0,1fr) 132px;gap:8px;align-items:start;margin:0 0 12px}.field,.filter-select{width:100%;min-width:0;min-height:45px;background:var(--field-bg);border:1.5px solid var(--field-line);border-radius:10px;color:var(--ink);padding:10px 12px;font-size:12px;outline:none;box-shadow:none;transition:border-color .15s}.field::placeholder{color:var(--muted)}.filter-select{appearance:none}.empty-card{border:1px solid var(--line);border-radius:17px;background:var(--surface);padding:25px 18px;text-align:center;box-shadow:var(--shadow);margin-top:6px}.empty-icon{width:36px;height:36px;margin:0 auto 10px;display:grid;place-items:center;color:var(--muted)}.empty-icon svg{width:25px;height:25px;stroke-width:1.7}.empty-title{font-size:13px;font-weight:700;margin:0 0 5px}.empty-note{font-size:10px;line-height:1.8;color:var(--muted);margin:0}.screen-panel{min-height:100%;display:flex;flex-direction:column}.screen-panel .empty-card{margin-top:4px}.hidden{display:none!important}.more-list{display:grid;gap:8px}.more-item{display:flex;align-items:center;gap:12px;padding:14px 13px;background:var(--surface);border:1px solid var(--line);border-radius:13px;color:var(--ink);font-size:12px;text-align:right}.more-item svg{width:19px;height:19px;color:var(--muted)}.more-item span{flex:1}.more-item .chevron{width:15px;height:15px}.floating-add{position:absolute;bottom:14px;right:8px;z-index:9;width:54px;height:54px;border:0;border-radius:50%;background:var(--button);color:var(--button-ink);font-family:Arial,sans-serif;font-size:30px;font-weight:400;line-height:1;box-shadow:0 5px 16px #0003;display:grid;place-items:center}.category-group{display:grid;gap:8px}.group-label{font-size:11px;font-weight:500;color:var(--muted);margin:0 3px 1px;line-height:1.7}.group-divider{height:1px;background:var(--line);margin:13px 0}.screen-blank{flex:1;min-height:220px}.top-toast{position:absolute;z-index:20;top:77px;right:18px;left:18px;background:var(--button);color:var(--button-ink);border-radius:11px;padding:12px;text-align:center;font-size:11px;box-shadow:var(--shadow)}
@media(min-width:600px){body{padding:14px 0}.phone{border-radius:30px;height:min(850px,calc(100dvh - 28px))}}
@media(max-width:350px){.topbar{gap:7px;padding:0 12px}.balance{padding:9px 10px;font-size:10px}.toolbar{grid-template-columns:minmax(0,1fr) 112px}.content{padding-right:14px;padding-left:14px}.navbtn{font-size:9px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.data-card{border-radius:17px;padding:14px 13px;box-shadow:0 3px 13px #1b292015}.data-card b{font-size:12px}.filter{border:1px solid var(--line);border-radius:30px;background:var(--surface);color:var(--ink);padding:8px 11px;white-space:nowrap;font-size:10px}.filter.sel{background:var(--button);color:var(--button-ink)}.form-card{padding:16px}.form-card .label{margin:10px 0 6px}.form-card .field{border-radius:10px}.form-card h3{font-size:12px;font-weight:600;line-height:1.6;margin:0}.section-label{font-size:11px!important;font-weight:500!important;color:var(--muted);margin:0 3px 8px!important;line-height:1.7}.form-section{display:grid;gap:0}.section-divider{height:1px;background:var(--line);margin:15px 0}.plan-card{border-radius:13px!important;background:var(--surface);padding:12px 13px;margin-top:8px;box-shadow:none;border:1px solid var(--line)}.plan-title{font-size:11px;font-weight:600;margin-bottom:2px}.add-plan-button{margin-top:10px;min-height:40px;font-size:11px}.summary{display:grid;gap:0}.summary .row{padding:10px 0;border-bottom:1px solid var(--line);font-size:11px;line-height:1.7}.summary .row:last-child{border-bottom:0}.summary .row span:last-child{font-weight:700;text-align:left}.actions{display:flex;gap:9px;margin-top:16px;align-items:stretch}.actions>*{flex:1;min-width:0}.primary,.secondary{min-height:45px;min-width:0;border-radius:10px;padding:10px 13px;font-size:12px;line-height:1.35;font-weight:700;border:1px solid var(--button)}.primary{background:var(--button);color:var(--button-ink);border-color:var(--button)}.secondary{background:transparent;color:var(--ink);border-color:var(--line)}.wide{width:100%}.stack{display:grid;gap:10px}.label{display:block;font-size:11px;font-weight:600;margin:15px 0 8px}.field{width:100%;min-height:45px;background:var(--field-bg);border:1.5px solid var(--field-line);border-radius:10px;color:var(--ink);padding:10px 12px;font-size:12px;outline:none}.summary{margin-top:8px}.toggle-row{display:flex;align-items:center;gap:10px;min-height:43px;padding:9px 0;border-bottom:1px solid var(--line);font-size:11px}.toggle-row span{flex:1;line-height:1.7}.toggle-row input{width:19px;height:19px;accent-color:var(--positive)}.tabs-row{display:flex;gap:0;overflow-x:auto;overflow-y:hidden;margin:0 0 14px;padding:0 1px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x;overscroll-behavior-x:contain;border-bottom:1px solid var(--line)}.tabs-row::-webkit-scrollbar{display:none}.tabs-row .filter{flex:0 0 auto;border:0;border-radius:0;background:transparent;color:var(--muted);padding:13px 13px 12px;font-size:11px;position:relative}.tabs-row .filter.sel{background:transparent;color:#111;font-weight:700}.tabs-row .filter.sel:after{content:"";position:absolute;bottom:-2px;right:10px;left:10px;height:3px;border-radius:3px 3px 0 0;background:#111}.profile-hero{background:linear-gradient(135deg,#fff 0%,#f2f8f6 100%);border:1px solid #dcebe7;border-radius:20px;padding:17px 15px;margin-bottom:15px;box-shadow:0 5px 18px #163e3510}.profile-hero-top{display:flex;align-items:center;gap:12px}.profile-avatar{width:54px;height:54px;display:grid;place-items:center;flex:none;border-radius:17px;background:#dff1ed;color:#00695C}.profile-avatar svg{width:27px;height:27px}.profile-name{font-size:15px;font-weight:700;line-height:1.6;margin:0 0 3px}.profile-meta{font-size:10px;color:var(--muted);line-height:1.8;overflow-wrap:anywhere}.account-kind{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:5px 9px;margin-top:7px;background:#edf1ef;color:#4c5854;font-size:10px;font-weight:700}.account-kind.subscriber{background:#dff1ed;color:#00695C}.account-kind svg{width:13px;height:13px}.profile-balance{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:15px;padding:12px 13px;border-radius:13px;background:#00695C;color:#fff}.profile-balance small{font-size:10px;opacity:.85}.profile-balance strong{font-size:17px}.profile-section-title{font-size:12px;font-weight:700;margin:0 0 8px}.profile-content{min-width:0}.profile-content .card{border-radius:15px}.calculated-cost{font-size:11px;color:var(--muted);padding:8px 0 2px}.calculated-cost b{color:var(--positive)}.notice{background:var(--chip);border-radius:10px;padding:12px;font-size:11px;line-height:1.9;color:var(--muted)}.toolbar .field,.toolbar .filter-select{min-height:43px}</style>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js"></script>
</head>
<body><div class="phone" id="phone">
<header class="topbar" aria-label="الشريط العلوي">
<button class="iconbtn" id="accountBtn" aria-label="الحساب" title="الحساب"><i data-lucide="user-round"></i></button>
<button class="iconbtn" id="bellBtn" aria-label="الإشعارات" title="الإشعارات"><i data-lucide="bell"></i><span class="dot hidden" id="noticeDot"></span></button>
<button class="balance" id="balanceBtn" aria-label="الرصيد المالي">الرصيد المالي</button>
</header>
<main class="content" id="content" aria-live="polite"></main>
<nav class="bottom" aria-label="الأقسام الرئيسية">
<button class="navbtn" data-screen="tasks"><i data-lucide="list-checks"></i><span>المهام</span></button>
<button class="navbtn" data-screen="subscriptions"><i data-lucide="shield-check"></i><span>الاشتراكات</span></button>
<button class="navbtn active" data-screen="home"><i data-lucide="house"></i><span>الرئيسية</span></button>
<button class="navbtn" data-screen="purchases"><i data-lucide="shopping-cart"></i><span>الطلبات</span></button>
<button class="navbtn" data-screen="more"><i data-lucide="ellipsis"></i><span>المزيد</span></button>
</nav><div id="toast" class="top-toast hidden" role="status"></div></div>
<script>
const $=id=>document.getElementById(id);const KEY='AMAN_SHARED_REGISTRY_V1';if(!localStorage.getItem(KEY))localStorage.setItem(KEY,JSON.stringify({version:2,customers:[],companies:[],packages:[],paymentMethods:[],purchaseRequests:[],numbers:[],subscriptions:[],operations:[],financeEntries:[],agents:[],employees:[]}));
function readDB(){try{let d=JSON.parse(localStorage.getItem(KEY)||'null');if(!d||typeof d!=='object')d={version:1,customers:[],companies:[],packages:[],paymentMethods:[],purchaseRequests:[],numbers:[],subscriptions:[],operations:[],financeEntries:[]};for(let k of ['customers','companies','packages','paymentMethods','purchaseRequests','numbers','subscriptions','operations','financeEntries'])if(!Array.isArray(d[k]))d[k]=[];return d}catch(e){return {version:1,customers:[],companies:[],packages:[],paymentMethods:[],purchaseRequests:[],numbers:[],subscriptions:[],operations:[],financeEntries:[]}}}
function writeDB(d){localStorage.setItem(KEY,JSON.stringify(d));try{if(window.AMAN_SYNC_CHANNEL)window.AMAN_SYNC_CHANNEL.postMessage({type:'registry-updated',key:KEY,at:Date.now()})}catch(e){}render()}
try{window.AMAN_SYNC_CHANNEL=('BroadcastChannel' in window)?new BroadcastChannel('AMAN_SHARED_REGISTRY_V1_SYNC'):null;if(window.AMAN_SYNC_CHANNEL)window.AMAN_SYNC_CHANNEL.onmessage=e=>{if(e.data?.key===KEY)render()};window.addEventListener('storage',e=>{if(e.key===KEY)render()})}catch(e){window.AMAN_SYNC_CHANNEL=null}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Number(n||0).toLocaleString('en-US');const date=d=>d?new Date(d).toLocaleDateString('ar-YE'):'—';
const mainSections=[
{id:'users-management',title:'إدارة الحسابات',icon:'users',groups:[{title:'العملاء',items:[['customer-clients','العملاء'],['customer-settings','الإعدادات']]},{title:'الوكلاء',items:[['customer-agents','الوكلاء']]},{title:'الإدارة',items:[['admin-employees','الموظفون']]}]},
{id:'companies',title:'إدارة الشركات',icon:'building-2',children:[]},
{id:'sales',title:'إدارة المبيعات',icon:'shopping-bag',children:[['point-packages','باقات النقاط'],['payment-methods','وسائل الدفع']]},
{id:'finance',title:'إدارة المالية',icon:'wallet',children:[['revenues','الإيرادات'],['expenses','المصروفات'],['ledger','دفتر المالية']]},
{id:'notification-management',title:'إدارة الإشعارات',icon:'bell-ring',children:[['system-notifications','إشعارات النظام'],['admin-alerts','تنبيهات الإدارة']]},
{id:'data-management',title:'إدارة البيانات',icon:'database',children:[['terms','الشروط والأحكام'],['privacy','سياسة الخصوصية']]},
{id:'settings',title:'الإعدادات',icon:'settings',children:[['app-lock','قفل التطبيق'],['dark-mode','الوضع الداكن']]}];
const titles={account:'الحساب',notifications:'الإشعارات',ledger:'دفتر المالية',tasks:'تنفيذ المهام',subscriptions:'الاشتراكات',purchases:'طلبات الشراء','customer-users':'المستخدمون','customer-subscribers':'المشتركون','customer-clients':'العملاء','customer-settings':'إعدادات العملاء','customer-agents':'الوكلاء','admin-management':'الإدارة','admin-employees':'الموظفون','customer-user-settings':'إعدادات صلاحيات المستخدمين','customer-subscriber-settings':'إعدادات صلاحيات المشتركين','agent-settings':'إعدادات صلاحيات الوكلاء','employee-settings':'إعدادات صلاحيات الموظفين','customer-agents-add':'إضافة وكيل','employee-add':'إضافة موظف','company-info':'معلومات الشركة الأساسية','company-plans':'الاشتراكات','company-tasks':'مهام السداد','registered-companies':'الشركات المسجلة','add-company':'إضافة شركة','point-packages':'باقات النقاط','add-package':'إضافة باقة','payment-methods':'وسائل الدفع','add-payment':'إضافة وسيلة دفع',revenues:'الإيرادات',expenses:'المصروفات','system-notifications':'إشعارات النظام','admin-alerts':'تنبيهات الإدارة',terms:'الشروط والأحكام',privacy:'سياسة الخصوصية','app-lock':'قفل التطبيق','dark-mode':'الوضع الداكن','profile':'ملف المشترك'};
const icons={ 'customer-settings':'settings','customer-users':'users','customer-subscribers':'user-check','customer-agents':'handshake','admin-management':'shield-check','admin-employees':'users','customer-user-settings':'settings','customer-subscriber-settings':'settings','agent-settings':'settings','employee-settings':'settings','customer-agents-add':'user-plus','employee-add':'user-plus','registered-companies':'building-2','point-packages':'package','payment-methods':'credit-card',revenues:'trending-up',expenses:'trending-down','system-notifications':'bell','admin-alerts':'bell-ring',terms:'file-text',privacy:'shield-check','app-lock':'lock','dark-mode':'moon'};
let current='home',stack=[],selectedCustomer=null,profileTab='profile',toastTimer,editEntityId=null,companyTab='info',userListQuery='',userListFilter='all';
function iconRefresh(){if(window.lucide)lucide.createIcons()}
function heading(title){return `<div class="screen-heading"><button class="screen-back" type="button" data-action="back" aria-label="العودة"><i data-lucide="arrow-right"></i></button><h1 class="screen-title">${esc(title)}</h1></div>`}
function moreScreen(){return `<div class="screen-panel">${heading('المزيد')}<div class="more-list">${mainSections.map(x=>`<button class="more-item" type="button" data-open="${x.id}"><i data-lucide="${x.icon}"></i><span>${x.title}</span><i class="chevron" data-lucide="chevron-left"></i></button>`).join('')}</div></div>`}
function categoryScreen(s){if(s.id==='companies')return companyList();let body=s.groups?s.groups.map(g=>`<section class="category-group"><h2 class="group-label">${g.title}</h2><div class="more-list">${g.items.map(([id,t])=>`<button class="more-item" data-open="${id}"><i data-lucide="${icons[id]||'circle'}"></i><span>${t}</span><i class="chevron" data-lucide="chevron-left"></i></button>${id==='customer-subscribers'?`<button class="more-item" data-open="customer-subscriber-settings"><i data-lucide="settings"></i><span>الإعدادات</span><i class="chevron" data-lucide="chevron-left"></i></button>`:''}${id==='customer-users'?`<button class="more-item" data-open="customer-user-settings"><i data-lucide="settings"></i><span>الإعدادات</span><i class="chevron" data-lucide="chevron-left"></i></button>`:''}${id==='customer-agents'?`<button class="more-item" data-open="agent-settings"><i data-lucide="settings"></i><span>الإعدادات</span><i class="chevron" data-lucide="chevron-left"></i></button><button class="more-item" data-open="customer-agents-add"><i data-lucide="user-plus"></i><span>إضافة وكيل</span><i class="chevron" data-lucide="chevron-left"></i></button>`:''}${id==='admin-employees'?`<button class="more-item" data-open="employee-settings"><i data-lucide="settings"></i><span>الإعدادات</span><i class="chevron" data-lucide="chevron-left"></i></button><button class="more-item" data-open="employee-add"><i data-lucide="user-plus"></i><span>إضافة موظف</span><i class="chevron" data-lucide="chevron-left"></i></button>`:''}`).join('')}</div></section>`).join('<div class="group-divider"></div>'):`<div class="more-list">${(s.children||[]).map(([id,t])=>`<button class="more-item" data-open="${id}"><i data-lucide="${icons[id]||'circle'}"></i><span>${t}</span><i class="chevron" data-lucide="chevron-left"></i></button>`).join('')}</div>`;return `<div class="screen-panel">${heading(s.title)}${body}</div>`}
function card(title,sub,action='',icon='circle'){return `<button class="more-item data-card" ${action?`data-action="${action}"`:''}><i data-lucide="${icon}"></i><span><b>${esc(title)}</b><small style="display:block;color:var(--muted);font-size:10px;margin-top:4px">${esc(sub)}</small></span><i class="chevron" data-lucide="chevron-left"></i></button>`}
function empty(msg){return `<div class="empty-card"><div class="empty-icon"><i data-lucide="inbox"></i></div><h3 class="empty-title">${esc(msg)}</h3><p class="empty-note">ستظهر البيانات هنا بعد إضافتها من خلال الإجراءات المتاحة.</p></div>`}
function field(id,label,placeholder='',type='text',value=''){return `<label class="label" for="${id}">${label}</label><input class="field" id="${id}" type="${type}" placeholder="" value="${esc(value)}">`}
function primary(label,act){return `<button class="primary wide" type="button" data-action="${act}">${label}</button>`}
function formCard(title,inside,saveAct){return `${heading(title)}<section class="card form-card">${inside}<div class="stack" style="margin-top:18px">${primary('حفظ',saveAct)}<button class="secondary wide" data-action="back">إلغاء</button></div></section>`}
function searchToolbar(placeholder='بحث بالاسم أو المعرف',filters=''){return `<div class="toolbar" style="grid-template-columns:minmax(0,1fr) 112px"><input class="field" data-search-input placeholder="${placeholder}" aria-label="${placeholder}"><select class="filter-select" data-list-filter aria-label="تصفية"><option value="all">الكل</option>${filters}</select></div>`}
function usersList(subscribers){let d=readDB(),list=d.customers.filter(c=>subscribers===null||!!c.firstPurchaseApproved===subscribers);return `<div class="screen-panel">${heading(subscribers===null?'العملاء':subscribers?'المشتركون':'المستخدمون')}${searchToolbar('بحث بالاسم أو البريد أو المعرف','<option value="users">المستخدمون</option><option value="subscribers">المشتركون</option><option value="active">نشطون</option><option value="inactive">غير نشطين</option>')}<div class="more-list" data-search-list>${list.length?list.map(c=>{let count=(c.numbers||[]).filter(n=>n.added).length;return `<button class="more-item data-card" data-customer="${esc(c.id)}" data-search="${esc([c.name,c.email,c.accountId,c.id].join(' ').toLowerCase())}" data-status="${c.active===false?'inactive':'active'}" data-kind="${c.firstPurchaseApproved?'subscribers':'users'}"><i data-lucide="user-round"></i><span><b>${esc(c.name||'—')}</b><small style="display:block;color:var(--muted);font-size:10px;margin-top:4px">${esc(c.accountId||c.id)} · ${count} رقم · ${c.firstPurchaseApproved?'مشترك':'مستخدم'}</small></span><i class="chevron" data-lucide="chevron-left"></i></button>`}).join(''):empty('لا توجد حسابات حتى الآن')}</div></div>`}
function placeholderSettings(title){return `<div class="screen-panel">${heading(title)}<section class="card form-card"><div class="notice">هذه الشاشة مخصصة لإعدادات هذا النوع من الحسابات. تفاصيل الصلاحيات ومحتواها ستحدد لاحقًا.</div><button class="secondary wide" style="margin-top:14px" data-action="back">العودة</button></section></div>`}
function staffList(kind){let d=readDB(),arr=kind==='agent'?(d.agents||[]):(d.employees||[]),label=kind==='agent'?'الوكلاء':'الموظفون';return `<div class="screen-panel">${heading(label)}${searchToolbar('بحث بالاسم أو المعرف','<option value="active">نشط</option><option value="inactive">غير نشط</option>')}<div class="more-list" data-search-list>${arr.length?arr.map(x=>`<button class="more-item data-card" data-staff="${esc(x.id)}" data-staff-kind="${kind}" data-search="${esc([x.name,x.accountId,x.email,x.id].join(' ').toLowerCase())}" data-status="${x.active===false?'inactive':'active'}"><i data-lucide="${kind==='agent'?'handshake':'user-round'}"></i><span><b>${esc(x.name||'—')}</b><small style="display:block;color:var(--muted);font-size:10px;margin-top:4px">${esc(x.accountId||x.email||x.id||'')}</small></span><i class="chevron" data-lucide="chevron-left"></i></button>`).join(''):empty(kind==='agent'?'لا يوجد وكلاء مضافون':'لا يوجد موظفون مضافون')}</div><button class="floating-add" data-action="new-staff-${kind}" aria-label="إضافة ${label}">+</button></div>`}
function staffForm(kind){let label=kind==='agent'?'وكيل':'موظف';return formCard('إضافة '+label,`${field('staff-name','الاسم الكامل','','text','')}${field('staff-email','البريد الإلكتروني','','email','')}${field('staff-id','المعرف','','text','')}`,kind==='agent'?'save-agent':'save-employee')}
function profileScreen(){
 let d=readDB(),c=d.customers.find(x=>x.id===selectedCustomer);if(!c)return usersList(null);
 let subscriber=!!c.firstPurchaseApproved;
 let tabs=subscriber?[['added','الأرقام'],['subs','الاشتراكات'],['radar','الرادار'],['operations','العمليات'],['requests','طلبات الشراء']]:[['added','الأرقام المضافة']];
 if(!tabs.some(t=>t[0]===profileTab))profileTab=tabs[0][0];
 let nums=(c.numbers||[]).filter(n=>n.added),panel='';
 if(profileTab==='added')panel=nums.map(n=>card(n.number,n.company||'شركة غير معروفة','','smartphone')).join('')||empty('لا توجد أرقام مضافة لهذا الحساب');
 if(profileTab==='subs')panel=nums.filter(n=>n.expiry&&new Date(n.expiry)>new Date()).map(n=>card(n.number,`الاشتراك حتى ${date(n.expiry)}`,'','shield-check')).join('')||empty('لا توجد اشتراكات نشطة');
 if(profileTab==='radar')panel=nums.filter(n=>n.radar).map(n=>card(n.number,n.company||'','','radar')).join('')||empty('لا توجد أرقام في الرادار');
 if(profileTab==='operations'){let arr=d.operations.filter(x=>x.customerId===c.id);panel=arr.length?arr.map(x=>card(x.type||'عملية',`${x.description||''} · ${x.status||''}`,'','activity')).join(''):empty('لا توجد عمليات مسجلة');}
 if(profileTab==='requests'){let arr=d.purchaseRequests.filter(x=>x.customerId===c.id);panel=arr.length?arr.map(x=>card(`${x.name} · ${fmt(x.points)} نقطة`,`الحالة: ${x.status} · ${fmt(x.price)} ر.ي · ${x.paymentMethod}`,'','receipt')).join(''):empty('لا توجد طلبات شراء');}
 let kind=subscriber?'مشترك':'مستخدم',kindIcon=subscriber?'shield-check':'user-round';
 return `<div class="screen-panel profile-screen">${heading('تفاصيل العميل')}
 <section class="profile-hero" aria-label="بطاقة الحساب الرئيسية"><div class="profile-hero-top"><div class="profile-avatar"><i data-lucide="${kindIcon}"></i></div><div style="min-width:0;flex:1"><h2 class="profile-name">${esc(c.name||'عميل أمان')}</h2><div class="profile-meta">${esc(c.email||'—')}<br>معرّف الحساب: ${esc(c.accountId||c.id)}</div><span class="account-kind ${subscriber?'subscriber':''}"><i data-lucide="${kindIcon}"></i>${kind}</span></div></div>${subscriber?`<div class="profile-balance"><div><small>رصيد أمان</small><div style="font-size:10px;margin-top:3px">الرصيد المتاح للاشتراك</div></div><strong>${fmt(c.balance)} نقطة</strong></div>`:''}</section>
 <div class="tabs-row profile-tabs" role="tablist" aria-label="أقسام تفاصيل العميل">${tabs.map(([id,t])=>`<button type="button" role="tab" aria-selected="${profileTab===id}" class="filter ${profileTab===id?'sel':''}" data-tab="${id}">${t}</button>`).join('')}</div>
 <div class="profile-content" role="tabpanel"><div class="more-list">${panel}</div></div></div>`
}
function companyList(){let d=readDB();return `<div class="screen-panel">${heading('إدارة الشركات')}${searchToolbar('بحث باسم الشركة أو المقدمة')}<div class="more-list" data-search-list>${d.companies.length?d.companies.map(c=>`<button class="more-item data-card" data-view-company="${esc(c.id)}" data-search="${esc([c.name,...(c.prefixes||[])].join(' ').toLowerCase())}"><i data-lucide="building-2"></i><span><b>${esc(c.name)}</b><small style="display:block;color:var(--muted);font-size:10px;margin-top:4px">المقدمات: ${esc((c.prefixes||[]).join('، '))} · ${(c.plans||[]).length} مدة اشتراك · ${c.hidden?'مخفية':'ظاهرة'}</small></span><i class="chevron" data-lucide="chevron-left"></i></button>`).join(''):empty('لا توجد شركات مضافة')}</div><button class="floating-add" data-action="new-company" aria-label="إضافة شركة">+</button></div>`}
function companyDetail(){let c=readDB().companies.find(x=>x.id===editEntityId);if(!c)return companyList();let tab=companyTab;let body=tab==='info'?`<section class="card"><h3>المعلومات الأساسية</h3><div class="summary">${[['اسم الشركة',c.name],['مقدمات الأرقام',(c.prefixes||[]).join('، ')],['طول الرقم',c.numberLength],['الكشف التلقائي',c.autoDetect===false?'متوقف':'مفعّل'],['الحالة',c.hidden?'مخفية':'ظاهرة']].map(([a,b])=>`<div class="row"><span class="muted">${a}</span><span>${esc(b??'—')}</span></div>`).join('')}</div></section>`:tab==='plans'?`<section class="card"><h3>مدد الاشتراك</h3>${(c.plans||[]).map(p=>`<div class="row"><span>${fmt(p.days)} يوم</span><b>${fmt(p.costPoints||Number(p.days)*Number(c.dailyRatePoints||c.tariffDailyPoints||0))} نقطة</b></div>`).join('')||'لا توجد مدد'}</section>`:`<section class="card"><h3>مهام السداد</h3><div class="summary">${[['الفاصل الدوري',`${c.paymentIntervalDays??90} يوم`],['الظهور قبل الموعد',`${c.executionLeadDays??10} يوم`],['المبلغ المالي للمهمة',`${fmt(c.recurringTaskAmount??0)} ر.ي`],['إعادة الجدولة',c.allowManualReschedule===false?'غير مسموحة':'مسموحة'],['إنشاء أول مهمة',c.createFirstTask===false?'لا':'نعم'],['مهام بعد الانتهاء',c.allowPostExpiryTasks?'مسموحة':'غير مسموحة'],['السماح بعد الانتهاء',`${c.allowedPostExpiryDays??0} يوم`],['تذكّر آخر مهمة عند التجديد',c.rememberLastTaskOnRenewal?'مفعّل':'غير مفعّل']].map(([a,b])=>`<div class="row"><span class="muted">${a}</span><span>${esc(b)}</span></div>`).join('')}</div></section>`;return `<div class="screen-panel">${heading(c.name)}<section class="card" style="margin-bottom:10px"><div class="row" style="display:flex;justify-content:space-between;align-items:center;gap:12px"><b>${esc(c.name)}</b><button class="iconbtn" data-action="edit-current-company" aria-label="تحرير الشركة" title="تحرير بيانات الشركة"><i data-lucide="pencil"></i></button></div><p class="small muted">المقدمات: ${esc((c.prefixes||[]).join('، '))} · التعرفة اليومية: ${fmt(c.dailyRatePoints||c.tariffDailyPoints||0)} نقطة</p></section><div class="tabs-row">${[['info','المعلومات'],['plans','الاشتراكات'],['tasks','مهام السداد']].map(([id,t])=>`<button class="filter ${tab===id?'sel':''}" data-company-tab="${id}">${t}</button>`).join('')}</div>${body}</div>`}
function toggleField(id,label,value){return `<label class="toggle-row" for="${id}"><span>${label}</span><input id="${id}" type="checkbox" ${value?'checked':''}><i aria-hidden="true"></i></label>`}
function companyPlanHtml(plans,rate){return (plans.length?plans:[{}]).map((pl,i)=>`<div class="plan-card card" data-plan-id="${esc(pl.id||'')}" data-plan-index="${i}"><div class="row"><span class="plan-title">مدة اشتراك ${i+1}</span>${i?'<button type="button" class="link" data-action="remove-plan" style="font-size:11px;color:#8b3b3b">إزالة</button>':''}</div>${field('plan-days-'+i,'المدة (أيام)','','number',pl.days??'')}<div class="calculated-cost" id="plan-cost-display-${i}">التكلفة: <b>${fmt((Number(pl.days)||0)*(Number(rate)||0))} نقطة</b></div><input type="hidden" id="plan-cost-${i}" value="${Number(pl.days||0)*Number(rate||0)}"></div>`).join('')}
function companyForm(){let c=editEntityId?readDB().companies.find(x=>x.id===editEntityId):null;let adding=!c;let tab=adding?'all':companyTab;let rate=Number(c?.dailyRatePoints??c?.tariffDailyPoints??4);let info=`<section class="form-section"><h3 class="section-label">المعلومات الأساسية</h3>${field('company-name','اسم الشركة','','text',c?.name||'')}${field('company-prefixes','مقدمات الأرقام (افصل بينها بفاصلة)','','text',(c?.prefixes||[]).join('، '))}${field('company-length','عدد خانات الرقم','','number',c?.numberLength??'')}${toggleField('company-auto','كشف الشركة تلقائيًا',c?.autoDetect!==false)}${toggleField('company-hidden','إخفاء الشركة عن العميل',!!c?.hidden)}</section>`;
let plans=`<section class="form-section"><h3 class="section-label">تعرفة الاشتراك</h3>${field('company-rate','تعرفة الاشتراك اليومي (نقاط)','','number',rate)}<p class="muted small" style="line-height:1.8">تُحسب تكلفة كل مدة تلقائيًا: عدد الأيام × التعرفة اليومية.</p><div id="plans-container">${companyPlanHtml(c?.plans||[{days:90}],rate)}</div><button type="button" class="secondary wide add-plan-button" data-action="add-plan">+ إضافة مدة اشتراك</button></section>`;
let tasks=`<section class="form-section"><h3 class="section-label">إعدادات مهام السداد</h3>${field('company-task-interval','الفاصل الدوري لمهام السداد (أيام)','','number',c?.paymentIntervalDays??90)}${field('company-task-lead','الظهور في شاشة التنفيذ قبل الموعد (أيام)','','number',c?.executionLeadDays??10)}${field('company-task-amount','المبلغ المالي للمهمة الدورية (ر.ي)','','number',c?.recurringTaskAmount??0)}${toggleField('company-reschedule','السماح بإعادة الجدولة اليدوية',c?.allowManualReschedule!==false)}${toggleField('company-first-task','إنشاء أول مهمة عند التفعيل',c?.createFirstTask!==false)}${toggleField('company-post-expiry','السماح بإنشاء مهام بعد انتهاء الاشتراك',!!c?.allowPostExpiryTasks)}${toggleField('company-remember-last-task','تذكّر تاريخ آخر مهمة عند التجديد',!!c?.rememberLastTaskOnRenewal)}${field('company-post-expiry-days','المدة المسموحة بعد الانتهاء (أيام)','','number',c?.allowedPostExpiryDays??0)}</section>`;
let inside=adding?`${info}<div class="section-divider"></div>${plans}<div class="section-divider"></div>${tasks}`:tab==='info'?info:tab==='plans'?plans:tasks;
let tabs=adding?'':`<div class="tabs-row"><button class="filter ${tab==='info'?'sel':''}" data-company-tab="info">المعلومات</button><button class="filter ${tab==='plans'?'sel':''}" data-company-tab="plans">الاشتراكات</button><button class="filter ${tab==='tasks'?'sel':''}" data-company-tab="tasks">مهام السداد</button></div>`;
return `<div class="screen-panel">${heading(adding?'إضافة شركة':'تعديل '+(c.name||'الشركة'))}${tabs}<section class="card form-card">${inside}<div class="stack" style="margin-top:18px">${primary('حفظ','save-company')}<button class="secondary wide" data-action="back">إلغاء</button></div></section></div>`}
function packageList(){let d=readDB();return `<div class="screen-panel">${heading('باقات النقاط')}${searchToolbar('بحث باسم الباقة')} ${d.packages.length?`<div class="more-list">${d.packages.map(p=>`<button class="more-item data-card" data-edit-package="${esc(p.id)}" data-search="${esc([p.name,p.points,p.price].join(' ').toLowerCase())}"><i data-lucide="package"></i><span><b>${esc(p.name)}</b><small style="display:block;color:var(--muted);font-size:10px;margin-top:4px">${fmt(p.points)} نقطة · ${fmt(p.price)} ر.ي</small></span><i class="chevron" data-lucide="chevron-left"></i></button>`).join('')}</div>`:empty('لا توجد باقات مضافة')}<button class="floating-add" data-action="new-package" aria-label="إضافة باقة">+</button></div>`}
function packageForm(){let p=editEntityId?readDB().packages.find(x=>x.id===editEntityId):null;return formCard(p?'تعديل الباقة':'إضافة باقة',`${field('package-name','اسم الباقة','','text',p?.name||'')}${field('package-points','عدد النقاط','','number',p?.points??'')}${field('package-price','السعر (ر.ي)','','number',p?.price??'')}`,'save-package')}
function paymentList(){let d=readDB();return `<div class="screen-panel">${heading('وسائل الدفع')}${d.paymentMethods.length?`<div class="more-list">${d.paymentMethods.map(p=>`<button class="more-item data-card" data-edit-payment="${esc(p.id)}"><i data-lucide="credit-card"></i><span><b>${esc(p.name)}</b><small style="display:block;color:var(--muted);font-size:10px;margin-top:4px">${esc(p.instructions||'')}</small></span><i class="chevron" data-lucide="chevron-left"></i></button>`).join('')}</div>`:empty('لا توجد وسائل دفع مضافة')}<button class="floating-add" data-action="new-payment" aria-label="إضافة وسيلة دفع">+</button></div>`}
function paymentForm(){let p=editEntityId?readDB().paymentMethods.find(x=>x.id===editEntityId):null;return formCard(p?'تعديل وسيلة دفع':'إضافة وسيلة دفع',`${field('payment-name','اسم وسيلة الدفع','','text',p?.name||'')}${field('payment-instructions','معلومات الحساب وتعليمات الدفع','','text',p?.instructions||'')}`,'save-payment')}
function entityDetail(kind){let d=readDB(),item=kind==='package'?d.packages.find(x=>x.id===editEntityId):d.paymentMethods.find(x=>x.id===editEntityId);if(!item)return kind==='package'?packageList():paymentList();let isP=kind==='package';let fields=isP?[['اسم الباقة',item.name],['النقاط',fmt(item.points)],['السعر',fmt(item.price)+' ر.ي']]:[['اسم الوسيلة',item.name],['معلومات وتعليمات الدفع',item.instructions||'—']];return `<div class="screen-panel">${heading(isP?'تفاصيل الباقة':'تفاصيل وسيلة الدفع')}<section class="card"><div class="row" style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h3>${esc(item.name)}</h3><button class="iconbtn" data-action="edit-current-${kind}" aria-label="تحرير" title="تحرير التفاصيل"><i data-lucide="pencil"></i></button></div><div class="summary">${fields.map(([a,b])=>`<div class="row"><span class="muted">${a}</span><span>${esc(b)}</span></div>`).join('')}</div></section></div>`}
function purchases(){let d=readDB(),arr=d.purchaseRequests.filter(x=>x.status==='قيد المراجعة');return `<div class="screen-panel">${heading('طلبات الشراء')}${arr.length?`<div class="more-list">${arr.map(r=>`<section class="card" style="padding:14px"><div class="row"><b style="font-size:12px">${esc(r.customerName||r.customerEmail)}</b><span class="pill">قيد المراجعة</span></div><p class="small muted">${esc(r.name)} · ${fmt(r.points)} نقطة · ${fmt(r.price)} ر.ي</p><p class="small">وسيلة الدفع: ${esc(r.paymentMethod)}<br>مرجع الدفع: ${esc(r.reference)}</p><div class="actions"><button class="primary" data-request="${esc(r.id)}" data-decision="approve">اعتماد الطلب</button><button class="secondary" data-request="${esc(r.id)}" data-decision="reject">رفض الطلب</button></div></section>`).join('')}</div>`:empty('لا توجد طلبات شراء معلقة')}</div>`}
function ledger(){let d=readDB(),entries=d.financeEntries.slice().reverse(),total=d.financeEntries.reduce((s,x)=>s+Number(x.amount||0),0);return `<div class="screen-panel">${heading('دفتر المالية')}<section class="card" style="margin-bottom:10px"><div class="muted small">الرصيد المالي المسجل</div><div style="font-size:19px;font-weight:700;margin-top:7px">${fmt(total)} ر.ي</div></section>${entries.length?`<div class="more-list">${entries.map(x=>card(x.description,`${x.type} · ${fmt(x.amount)} ر.ي · ${date(x.createdAt)}`,'','wallet')).join('')}</div>`:empty('لا توجد حركات مالية مسجلة')}</div>`}
function render(){const d=readDB(),finance=d.financeEntries.reduce((s,x)=>s+Number(x.amount||0),0);$('balanceBtn').textContent=fmt(finance)+' ر.ي';let body='';let sec=mainSections.find(x=>x.id===current);if(current==='home')body='';else if(current==='more')body=moreScreen();else if(current==='companies')body=companyList();else if(sec)body=categoryScreen(sec);else if(current==='customer-users')body=usersList(false);else if(current==='customer-subscribers')body=usersList(true);else if(current==='customer-clients')body=usersList(null);else if(current==='customer-agents')body=staffList('agent');else if(current==='admin-employees')body=staffList('employee');else if(current==='customer-agents-add')body=staffForm('agent');else if(current==='employee-add')body=staffForm('employee');else if(['customer-settings','customer-user-settings','customer-subscriber-settings','agent-settings','employee-settings'].includes(current))body=placeholderSettings(titles[current]);else if(current==='profile')body=profileScreen();else if(current==='registered-companies')body=companyList();else if(current==='company-detail')body=companyDetail();else if(current==='package-detail')body=entityDetail('package');else if(current==='payment-detail')body=entityDetail('payment');else if(current==='add-company')body=companyForm();else if(current==='point-packages')body=packageList();else if(current==='add-package')body=packageForm();else if(current==='payment-methods')body=paymentList();else if(current==='add-payment')body=paymentForm();else if(current==='purchases')body=purchases();else if(current==='ledger')body=ledger();else if(current==='revenues')body=`<div class="screen-panel">${heading('الإيرادات')}${empty('محتوى شاشة الإيرادات غير مفعّل في هذه المعاينة.')}</div>`;else if(current==='account')body=`<div class="screen-panel">${heading('الحساب')}${empty('إدارة حساب الإدارة ليست مفعلة في المرجع المحلي')}</div>`;else if(current==='notifications')body=`<div class="screen-panel">${heading('الإشعارات')}${empty('لا توجد إشعارات إدارية')}</div>`;else if(current==='subscriptions')body=`<div class="screen-panel">${heading('الاشتراكات')}${d.subscriptions.length?`<div class="more-list">${d.subscriptions.map(s=>card(s.number,`${s.company} · حتى ${date(s.expiry)}`,'','shield-check')).join('')}</div>`:empty('لا توجد اشتراكات')}</div>`;else if(current==='tasks')body=`<div class="screen-panel">${heading('تنفيذ المهام')}${empty('لا توجد مهام في هذا المرجع المحلي')}</div>`;else {let title=titles[current]||current;body=`<div class="screen-panel">${heading(title)}${empty('هذه الشاشة محددة بنيويًا وسيُستكمل محتواها لاحقًا.')}</div>`}$('content').innerHTML=body;document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.screen===current));iconRefresh()}
function go(id){if(id===current)return;stack.push(current);current=id;render()}function back(){current=stack.pop()||'home';render()}function toast(msg){let t=$('toast');if(!t)return;t.textContent=msg;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),2600)}
function saveCompany(){let old=editEntityId?readDB().companies.find(c=>c.id===editEntityId):null;let val=(id,fallback='')=>$(id)?$(id).value:fallback;let checked=(id,fallback=false)=>$(id)?$(id).checked:fallback;let name=val('company-name',old?.name||'').trim(),prefixes=val('company-prefixes',(old?.prefixes||[]).join('، ')).split(/[,،\s]+/).map(x=>x.trim()).filter(Boolean),len=Number(val('company-length',old?.numberLength||0));let rate=Number(val('company-rate',old?.dailyRatePoints??old?.tariffDailyPoints??4));let plans=[];document.querySelectorAll('#plans-container .plan-card').forEach((el,i)=>{let days=Number(el.querySelector('input[id^="plan-days-"]')?.value);if(days>0&&rate>0)plans.push({id:el.dataset.planId||'PL-'+Date.now()+'-'+i,days,costPoints:days*rate})});if(!plans.length&&old?.plans?.length)plans=old.plans.map(p=>({...p,costPoints:Number(p.days)*rate}));let interval=Number(val('company-task-interval',old?.paymentIntervalDays??90)),lead=Number(val('company-task-lead',old?.executionLeadDays??10)),taskAmount=Number(val('company-task-amount',old?.recurringTaskAmount??0)),postDays=Number(val('company-post-expiry-days',old?.allowedPostExpiryDays??0));if(!name||!prefixes.length||!Number.isInteger(len)||len<1||rate<=0||!plans.length||interval<=0||lead<0||taskAmount<0||postDays<0){toast('تحقق من الاسم والمقدمات وطول الرقم والتعرفة ومدد الاشتراك وإعدادات المهام');return}let d=readDB();if(d.companies.some(c=>c.id!==editEntityId&&c.name.toLowerCase()===name.toLowerCase())){toast('اسم الشركة مسجل بالفعل');return}for(let p of prefixes){if(d.companies.some(c=>c.id!==editEntityId&&(c.prefixes||[]).some(q=>q===p))){toast('إحدى المقدمات مستخدمة في شركة أخرى');return}}let cfg={name,prefixes,numberLength:len,autoDetect:checked('company-auto',old?.autoDetect!==false),hidden:checked('company-hidden',old?.hidden||false),dailyRatePoints:rate,tariffDailyPoints:rate,plans,paymentIntervalDays:interval,executionLeadDays:lead,recurringTaskAmount:taskAmount,allowManualReschedule:checked('company-reschedule',old?.allowManualReschedule!==false),createFirstTask:checked('company-first-task',old?.createFirstTask!==false),allowPostExpiryTasks:checked('company-post-expiry',old?.allowPostExpiryTasks||false),rememberLastTaskOnRenewal:checked('company-remember-last-task',old?.rememberLastTaskOnRenewal||false),allowedPostExpiryDays:postDays,updatedAt:new Date().toISOString()};if(editEntityId){let i=d.companies.findIndex(c=>c.id===editEntityId);if(i<0){toast('تعذر العثور على الشركة للتعديل');return}d.companies[i]={...d.companies[i],...cfg}}else d.companies.push({id:'CO-'+Date.now(),...cfg,createdAt:new Date().toISOString()});editEntityId=null;writeDB(d);current='companies';stack=[];render();toast('تم حفظ إعدادات الشركة وتحديث بيانات العميل المشتركة')}
function saveStaff(kind){let name=$('staff-name')?.value.trim(),email=$('staff-email')?.value.trim(),accountId=$('staff-id')?.value.trim();if(!name||(!email&&!accountId)){toast('أدخل الاسم والبريد أو المعرف');return}let d=readDB(),key=kind==='agent'?'agents':'employees';if(!Array.isArray(d[key]))d[key]=[];if(d[key].some(x=>(email&&x.email?.toLowerCase()===email.toLowerCase())||(accountId&&x.accountId===accountId))){toast('البريد أو المعرف مسجل مسبقًا');return}d[key].push({id:(kind==='agent'?'AG-':'EM-')+Date.now(),name,email,accountId,active:true,createdAt:new Date().toISOString()});writeDB(d);current=kind==='agent'?'customer-agents':'admin-employees';stack=[];render();toast('تمت الإضافة في سجل المحاكاة المحلي')}
function savePackage(){let name=$('package-name').value.trim(),price=Number($('package-price').value),points=Number($('package-points').value);if(!name||price<=0||points<=0){toast('أدخل اسم الباقة والسعر وعدد النقاط بصورة صحيحة');return}let d=readDB();if(editEntityId){let i=d.packages.findIndex(x=>x.id===editEntityId);if(i<0){toast('تعذر العثور على الباقة للتعديل');return}d.packages[i]={...d.packages[i],name,price,points,updatedAt:new Date().toISOString()}}else d.packages.push({id:'PK-'+Date.now(),name,price,points,createdAt:new Date().toISOString()});editEntityId=null;writeDB(d);current='point-packages';stack=[];render();toast('تم حفظ بيانات الباقة')}
function savePayment(){let name=$('payment-name').value.trim(),instructions=$('payment-instructions').value.trim();if(!name){toast('أدخل اسم وسيلة الدفع');return}let d=readDB();if(editEntityId){let i=d.paymentMethods.findIndex(x=>x.id===editEntityId);if(i<0){toast('تعذر العثور على وسيلة الدفع للتعديل');return}d.paymentMethods[i]={...d.paymentMethods[i],name,instructions,updatedAt:new Date().toISOString()}}else d.paymentMethods.push({id:'PM-'+Date.now(),name,instructions,createdAt:new Date().toISOString()});editEntityId=null;writeDB(d);current='payment-methods';stack=[];render();toast('تم حفظ بيانات وسيلة الدفع')}
function decideRequest(id,decision){let d=readDB(),r=d.purchaseRequests.find(x=>x.id===id);if(!r||r.status!=='قيد المراجعة')return;let c=d.customers.find(x=>x.id===r.customerId);if(!c){toast('تعذر العثور على حساب العميل');return}if(decision==='approve'){let before=Number(c.balance)||0;c.balance=before+Number(r.points||0);c.firstPurchaseApproved=true;c.status='مشترك';r.status='معتمد';r.reviewedAt=new Date().toISOString();let op={id:'OP-'+Date.now(),type:'اعتماد شحن رصيد أمان',description:`${r.name} · ${r.points} نقطة`,points:Number(r.points),status:'مكتملة',time:new Date().toISOString(),pointsBefore:before,pointsAdded:Number(r.points),pointsAfter:c.balance,purchasePoints:Number(r.points),purchasePrice:Number(r.price),customerId:c.id};c.operations=c.operations||[];c.operations.unshift(op);d.operations.push(op);d.financeEntries.push({id:'FIN-'+Date.now(),type:'إيراد',description:`طلب شحن ${r.name} — ${c.name}`,amount:Number(r.price),customerId:c.id,requestId:r.id,createdAt:new Date().toISOString()});}else{r.status='مرفوض';r.reviewedAt=new Date().toISOString()}d.customers=d.customers.map(x=>x.id===c.id?c:x);writeDB(d);toast(decision==='approve'?'تم اعتماد الطلب وإضافة رصيد أمان وتسجيل الإيراد':'تم رفض طلب الشراء')}
function addPlan(){let box=$('plans-container');if(!box)return;let i=box.querySelectorAll('.plan-card').length,rate=Number($('company-rate')?.value||4);box.insertAdjacentHTML('beforeend',`<div class="plan-card card" data-plan-index="${i}"><div class="row"><span class="plan-title">مدة اشتراك ${i+1}</span><button type="button" class="link" data-action="remove-plan" style="font-size:11px;color:#8b3b3b">إزالة</button></div>${field('plan-days-'+i,'المدة (أيام)','','number','')}<div class="calculated-cost" id="plan-cost-display-${i}">التكلفة: <b>0 نقطة</b></div><input type="hidden" id="plan-cost-${i}" value="0"></div>`);}

document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.action==='back'){back();return}if(b.dataset.action==='new-company'){editEntityId=null;companyTab='info';go('add-company');return}if(b.dataset.action==='new-package'){editEntityId=null;go('add-package');return}if(b.dataset.action==='new-payment'){editEntityId=null;go('add-payment');return}if(b.dataset.action==='new-staff-agent'){go('customer-agents-add');return}if(b.dataset.action==='new-staff-employee'){go('employee-add');return}if(b.dataset.viewCompany){editEntityId=b.dataset.viewCompany;companyTab='info';go('company-detail');return}if(b.dataset.editCompany){editEntityId=b.dataset.editCompany;go('add-company');return}if(b.dataset.action==='edit-current-company'){go('add-company');return}if(b.dataset.action==='edit-current-package'){go('add-package');return}if(b.dataset.action==='edit-current-payment'){go('add-payment');return}if(b.dataset.editPackage){editEntityId=b.dataset.editPackage;go('package-detail');return}if(b.dataset.editPayment){editEntityId=b.dataset.editPayment;go('payment-detail');return}if(b.dataset.companyTab){companyTab=b.dataset.companyTab;render();return}if(b.dataset.open){editEntityId=null;go(b.dataset.open);return}if(b.dataset.customer){selectedCustomer=b.dataset.customer;profileTab='profile';go('profile');return}if(b.dataset.tab){profileTab=b.dataset.tab;render();requestAnimationFrame(()=>{let active=document.querySelector('.profile-tabs [data-tab="'+profileTab+'"]');if(active)active.scrollIntoView({behavior:'smooth',block:'nearest',inline:'nearest'})});return}if(b.dataset.action==='save-company'){saveCompany();return}if(b.dataset.action==='save-package'){savePackage();return}if(b.dataset.action==='save-payment'){savePayment();return}if(b.dataset.action==='save-agent'){saveStaff('agent');return}if(b.dataset.action==='save-employee'){saveStaff('employee');return}if(b.dataset.action==='add-plan'){addPlan();return}if(b.dataset.action==='remove-plan'){b.closest('.plan-card').remove();return}if(b.dataset.request){decideRequest(b.dataset.request,b.dataset.decision);return}});
